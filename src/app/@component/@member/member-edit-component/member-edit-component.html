<form [formGroup]="userProfileForm" (ngSubmit)="onSubmit()" class="container mt-4">

  <h3 class="mb-4">會員資料編輯</h3>

  <div class="row">

    <!-- 基本資料 -->
    <div class="col-md-6 mb-3">
      <label class="form-label">真實姓名</label>
      <input type="text" class="form-control" formControlName="realName">
    </div>

    <div class="col-md-6 mb-3">
      <label class="form-label">英文名字</label>
      <input type="text" class="form-control" formControlName="englishName">
    </div>

    <div class="col-md-6 mb-3">
      <label class="form-label">電話</label>
      <input type="text" class="form-control" formControlName="phone">
    </div>

    <div class="col-12 mb-3">
      <label class="form-label">地址</label>
      <input type="text" class="form-control" formControlName="address">
    </div>

    <div class="col-12 mb-3">
      <label class="form-label">自我介紹</label>
      <textarea class="form-control" rows="3" formControlName="bio"></textarea>
    </div>

    <div class="row g-2">

    <!-- City -->

    <app-location-select
      [districtId]="userProfileForm.value.districtId"
      (districtSelected)="onDistrictSelected($event)">
    </app-location-select>

  </div>

    <!-- 作息 -->
    <div class="col-md-6 mb-3">
      <label class="form-label">睡覺時間</label>
      <input type="number" class="form-control" formControlName="sleepTime">
    </div>

    <div class="col-md-6 mb-3">
      <label class="form-label">起床時間</label>
      <input type="number" class="form-control" formControlName="wakeTime">
    </div>


    <!-- 個性 -->
    <div class="col-md-6 mb-3">
      <label class="form-label">清潔程度 (0-5)</label>
      <input type="number" class="form-control" formControlName="cleanLevel" max="5" min="1">
    </div>

    <div class="col-md-6 mb-3">
      <label class="form-label">噪音容忍度 (0-5)</label>
      <input type="number" class="form-control" formControlName="noiseTolerance" max="5" min="1">
    </div>

    <!-- 開關 -->
    <div class="col-md-6 form-check mb-2">
      <input class="form-check-input" type="checkbox" formControlName="pet">
      <label class="form-check-label">可養寵物</label>
    </div>

    <div class="col-md-6 form-check mb-2">
      <input class="form-check-input" type="checkbox" formControlName="smoke">
      <label class="form-check-label">可吸菸</label>
    </div>

    <!-- 興趣 -->
    <div class="col-12 mb-3">
      <label class="form-label">興趣</label>
      <input type="text" class="form-control" formControlName="interests">
    </div>

  </div>

  <!-- 按鈕 -->
  <button type="submit" class="btn btn-primary" [disabled]="!userProfileForm.valid">
    儲存修改
  </button>

</form>
