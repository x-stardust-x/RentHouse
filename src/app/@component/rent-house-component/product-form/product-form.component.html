<div class="form-section">
  <h3>新增資產 / 技能申請</h3>
  <p class="text-muted mb-4">發布您可以共享的工具或專業技能，讓社群生活更豐富！</p>

  <div class="row g-3">
    <div class="col-md-8">
      <label class="form-label fw-bold">名稱：</label>
      <input type="text" class="form-control" [(ngModel)]="productFormData.name" placeholder="例如：BOSCH 電動電鑽、基礎日文會話教學">
    </div>
    <div class="col-md-4">
      <label class="form-label fw-bold">分類：</label>
      <select class="form-select" [(ngModel)]="productFormData.category">
        <option value="工具">🛠️ 實體工具</option>
        <option value="技能">🧠 專業技能</option>
        <option value="設備">💻 3C/設備</option>
        <option value="勞務">💪 勞務協助</option>
      </select>
    </div>

    <div class="col-md-4">
      <label class="form-label fw-bold">計價 (元)：</label>
      <input type="number" class="form-control" [(ngModel)]="productFormData.price" placeholder="金額">
    </div>
    <div class="col-md-4">
      <label class="form-label fw-bold">計價單位：</label>
      <select class="form-select" [(ngModel)]="productFormData.priceUnit">
        <option value="次">/ 次</option>
        <option value="小時">/ 小時</option>
        <option value="天">/ 天</option>
        <option value="件">/ 件</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label fw-bold">押金 (元)：</label>
      <input type="number" class="form-control" [(ngModel)]="productFormData.deposit" placeholder="無則填 0">
    </div>

    <div class="col-md-4">
      <label class="form-label fw-bold">提供數量：</label>
      <input type="number" class="form-control" [(ngModel)]="productFormData.quantity" min="1">
    </div>
    <div class="col-md-8">
      <label class="form-label fw-bold">提供地點 / 地址：</label>
      <input type="text" class="form-control" [(ngModel)]="productFormData.address" placeholder="填寫可面交地點或服務範圍">
    </div>

    <div class="col-12 mt-4">
      <label class="form-label fw-bold">詳細描述：</label>
      <textarea class="form-control" rows="4" [(ngModel)]="productFormData.description" placeholder="請描述這項工具的狀況或技能的服務內容..."></textarea>
    </div>

    <div class="form-section mt-4 mb-4 p-4" style="background-color: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; width: 100%;">
      <h4 style="color: #1e293b; margin-bottom: 20px; font-weight: bold;">📝 附加規定與要求</h4>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-bold text-secondary">自備工具說明</label>
          <input type="text" class="form-control" [(ngModel)]="productFormData.ownTool" placeholder="例如：需自備鑽頭、請自備瑜珈墊">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold text-secondary">證照/知識要求</label>
          <input type="text" class="form-control" [(ngModel)]="productFormData.requiredKnowledge" placeholder="例如：需具備基礎水電知識">
        </div>
      </div>
    </div>
  </div>

  <div class="mb-3 mt-2" style="padding: 15px; background: #fff; border: 1px dashed #cbd5e1; border-radius: 8px;">
    <h4 style="font-size: 1rem; margin-top: 0; margin-bottom: 15px; color: #334155;">📷 工具/技能 照片上傳</h4>
    <input type="file" class="form-control mb-3" multiple (change)="onProductFilesSelected($event)" accept="image/*">
    @if (productPendingPhotos && productPendingPhotos.length > 0) {
      <div class="d-flex flex-wrap bg-light p-3 rounded border">
        @for (photo of productPendingPhotos; track $index) {
          <div class="me-3 mb-3 text-center bg-white border p-2 rounded shadow-sm position-relative">
            <button type="button" class="btn btn-danger position-absolute d-flex justify-content-center align-items-center" style="top: -10px; right: -10px; width: 24px; height: 24px; border-radius: 50%; padding: 0; font-size: 12px; z-index: 10;" (click)="removeProductPendingPhoto($index)">✕</button>
            <img [src]="photo.previewUrl" class="img-thumbnail mb-2" style="width: 120px; height: 120px; object-fit: cover;">
            <div class="form-check d-flex justify-content-center align-items-center">
              <input class="form-check-input me-1" type="radio" name="prodRadio_{{$index}}" [checked]="photo.isCover" (change)="setProductPendingCover($index)">
              <label class="form-check-label fw-bold ms-1" [class.text-danger]="photo.isCover">{{ photo.isCover ? '⭐ 首圖' : '設為首圖' }}</label>
            </div>
          </div>
        }
      </div>
    }
  </div>

  <div class="form-actions mt-4">
    <button class="btn btn-success me-2 fw-bold" (click)="submitProductForm()">確認送出資產申請</button>
  </div>
</div>
