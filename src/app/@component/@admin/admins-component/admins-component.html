<div class="container mt-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">管理員 管理</h3>

    <!-- 新增按鈕 -->
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createAdminModal">
      + 新增管理員
    </button>
  </div>

  <!-- 表格 -->
  @if (adminservice.admins() && adminservice.admins().length > 0) {

  <div class="card shadow-sm">
    <div class="card-body p-0">

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">

          <thead class="table-dark">
            <tr>
              <th>名子</th>
              <th>信箱</th>
              <th>電話</th>
              <th class="text-end">操作</th>
            </tr>
          </thead>

          <tbody>

            @for (admin of adminservice.admins(); track admin.id) {
            <tr>

              <td>{{ admin.username }}</td>
              <td>{{ admin.email }}</td>
              <td>{{ admin.phone }}</td>

              <td class="text-end">
                @if(admin.id != now_adminid){
                <button class="btn btn-warning btn-sm me-2" (click)="resetPwd(admin.id)">
                  重製密碼
                </button>

                <button class="btn btn-danger btn-sm" (click)="deleteAdmin(admin.id)">
                  刪除
                </button>
                }
              </td>

            </tr>
            }

          </tbody>

        </table>
      </div>

    </div>
  </div>

  } @else {
  <div class="alert alert-info">
    目前沒有 Admin
  </div>
  }

</div>

<!-- ================= MODAL ================= -->

<div class="modal fade" id="createAdminModal" tabindex="-1">
  <div class="modal-dialog">

    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">新增管理員</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="mb-2">
          <label>名子</label>
          <input class="form-control" [(ngModel)]="newAdmin.username">
        </div>

        <div class="mb-2">
          <label>信箱</label>
          <input class="form-control" [(ngModel)]="newAdmin.email">
        </div>

        <div class="mb-2">
          <label>電話</label>
          <input class="form-control" [(ngModel)]="newAdmin.phone">
        </div>

        <div class="mb-2">
          <label>密碼</label>
          <input type="password" class="form-control" [(ngModel)]="newAdmin.pwd">
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          取消
        </button>

        <button class="btn btn-primary" (click)="createAdmin()" data-bs-dismiss="modal">
          新增
        </button>
      </div>

    </div>

  </div>
</div>
