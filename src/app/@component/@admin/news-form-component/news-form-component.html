<section class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-4">

    <div>
      @if (isEdit) {
      <h2 class="mb-1">修改最新消息</h2>
      <p class="text-muted mb-0">
        編輯新聞內容與 SEO 資訊
      </p>
      } @else {
      <h2 class="mb-1">新增最新消息</h2>
      }
    </div>

    <button class="btn btn-outline-secondary" routerLink="/admin/news">
      返回列表
    </button>

  </div>

  <div class="card shadow-sm border-0">

    <div class="card-body">

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="row g-3">
          <!-- 分類 -->
          <div class="col-md-6">
            <label class="form-label">分類</label>

            <select class="form-select" formControlName="category">

              <option value="平台公告">平台公告</option>
              <option value="共居導覽">共居導覽</option>
              <option value="會員故事">會員故事</option>

            </select>
          </div>

          <!-- 狀態 -->
          <div class="col-md-6">
            <label class="form-label">狀態</label>

            <select class="form-select" formControlName="status">

              <option [value]="0">草稿</option>
              <option [value]="1">已發布</option>

            </select>
          </div>

          <!-- 標題 -->
          <div class="col-12">
            <label class="form-label">文章標題</label>

            <input type="text" class="form-control" formControlName="title">
          </div>

          <!-- 前言 -->
          <div class="col-12">
            <label class="form-label">文章前言</label>

            <textarea class="form-control" rows="3" formControlName="intro"></textarea>
          </div>

          <!-- 內文 -->
          <div class="col-12">
            <label class="form-label">文章內容</label>

            <textarea class="form-control" rows="8" formControlName="content"></textarea>
          </div>

          <!-- SEO Title -->
          <div class="col-12">
            <label class="form-label">SEO 標題</label>

            <input type="text" class="form-control" formControlName="seoTitle">
          </div>

          <!-- SEO Desc -->
          <div class="col-12">
            <label class="form-label">SEO 描述</label>

            <textarea class="form-control" rows="3" formControlName="seoDesc"></textarea>
          </div>

        </div>

        <!-- 按鈕 -->
        <div class="d-flex justify-content-end gap-2 mt-4">

          <button type="button" class="btn btn-outline-secondary" routerLink="/admin/news">
            取消
          </button>

          <button type="submit" class="btn btn-primary">
            @if (isEdit) {
            儲存修改
            } @else {
            新增消息
            }
          </button>

        </div>

      </form>

    </div>

  </div>

</section>
