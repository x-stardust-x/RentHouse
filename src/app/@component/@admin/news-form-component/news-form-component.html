<section class="container-fluid py-4 news-editor">

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="row g-4">

      <!-- 左側 -->
      <div class="col-lg-8">

        <!-- 基本資訊 -->
        <div class="editor-card p-4 mb-4">

          <label class="form-label small-title">文章標題</label>

          <input
            type="text"
            class="form-control custom-input title-input"
            formControlName="title"
            placeholder="請輸入文章標題"
          >

          <div class="row g-3 mt-1">

            <!-- 分類 -->
            <div class="col-md-6">

              <label class="form-label small-title">分類選擇</label>

              <select class="form-select custom-input" formControlName="category">
                <option value="平台公告">平台公告</option>
                <option value="共居導覽">共居導覽</option>
                <option value="會員故事">會員故事</option>
              </select>

            </div>

          </div>

        </div>

        <!-- 封面圖片 -->
        <div class="editor-card p-4 mb-4">

          <label class="form-label small-title mb-3">封面圖片</label>

          <label class="upload-box">

            <input
              type="file"
              accept="image/*"
              hidden
              (change)="onFileChange($event)"
            >

            @if (imagePreview()) {

            <img
              [src]="imagePreview()"
              class="preview-img"
            >

            } @else {

            <div class="upload-content">
              <i class="bi bi-cloud-arrow-up"></i>
              <p class="mb-1">點擊或拖曳圖片至此上傳</p>
              <small>建議尺寸 1200 x 630 px</small>
            </div>

            }

          </label>

        </div>

        <!-- 文章前言 -->
        <div class="editor-card p-4 mb-4">

          <label class="form-label small-title">文章前言</label>

          <textarea
            rows="4"
            class="form-control custom-textarea"
            formControlName="intro"
            placeholder="請輸入文章前言..."
          ></textarea>

        </div>

        <!-- 文章內容 -->
        <div class="editor-card p-4">

          <label class="form-label small-title">文章內容</label>

          <textarea
            rows="12"
            class="form-control custom-textarea"
            formControlName="content"
            placeholder="在此繼續撰寫您的精彩內容..."
          ></textarea>

        </div>

      </div>

      <!-- 右側 -->
      <div class="col-lg-4">

        <!-- 發佈 -->
        <div class="editor-card p-4 mb-4">

          <h5 class="side-title">發布動作</h5>

          <div class="d-grid gap-3 mt-4">

            <button
              type="button"
              class="btn btn-light custom-btn"
              routerLink="../../"
            >
              返回新聞列表
            </button>

            <button
  class="btn publish-btn"
  (click)="onSubmit()"
  [disabled]="isSubmitting()">

  @if (isSubmitting()) {
    <span class="spinner-border spinner-border-sm me-2"></span>
    儲存中...
  } @else {
    {{ isEdit ? '更新' : '新增' }}
  }

</button>

          </div>

        </div>

        <!-- 狀態 -->
        <div class="editor-card p-4 mb-4">

          <h5 class="side-title">文章狀態</h5>

          <div class="mt-3">

            <div class="form-check status-radio">
              <input
                class="form-check-input mx-1"
                type="radio"
                [value]="0"
                formControlName="status"
                id="draft"
              >

              <label class="form-check-label" for="draft">
                草稿
              </label>
            </div>

            <div class="form-check status-radio mt-3">
              <input
                class="form-check-input mx-1"
                type="radio"
                [value]="1"
                formControlName="status"
                id="publish"
              >

              <label class="form-check-label" for="publish">
                已發布
              </label>
            </div>

          </div>

        </div>

        <!-- SEO -->
        <div class="editor-card p-4">

          <h5 class="side-title">搜尋引擎最佳化 (SEO)</h5>

          <div class="mt-4">

            <label class="form-label small-title">Meta 標題</label>

            <input
              type="text"
              class="form-control custom-input"
              formControlName="seoTitle"
              placeholder="留空將自動使用文章標題"
            >

          </div>

          <div class="mt-4">

            <label class="form-label small-title">Meta 描述</label>

            <textarea
              rows="5"
              class="form-control custom-textarea"
              formControlName="seoDesc"
              placeholder="為搜尋引擎提供一段簡短吸引人的文章摘要..."
            ></textarea>

          </div>

        </div>

      </div>

    </div>

  </form>

</section>
