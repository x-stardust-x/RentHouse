<div class="public-layout">

  <header #layoutHeader class="public-layout__header">
    <!-- 之後可以放前台導覽列 -->
    <a routerLink="/" class="public-layout__logo">厚厝味</a>

    <nav class="public-layout__nav">

      <nav class="public-layout__nav" aria-label="前台主要導覽">

        <a class="nav-link" routerLink="home" routerLinkActive="is-active">首頁</a>

        <a class="nav-link" routerLink="/admin" routerLinkActive="is-active">管理員</a>

        <a class="nav-link" routerLink="login" routerLinkActive="is-active">登入</a>

        <a class="nav-link" routerLink="member/dashboard" routerLinkActive="is-active">會員中心</a>

        <a class="nav-link" routerLink="/rental-matching-component" routerLinkActive="is-active">租賃物媒合</a>

        <a class="nav-link" routerLink="/rent" routerLinkActive="is-active">租屋管理</a>

        <a class="nav-link" routerLink="/home" routerLinkActive="is-active">個人主頁</a>

        <a class="nav-link" routerLink="/contact" routerLinkActive="is-active">聯絡我們</a>



        <div class="public-layout__font-tools" aria-label="字體大小設定">
          <span class="public-layout__font-label">字體</span>

          <button type="button" class="public-layout__font-button" [class.is-active]="fontSize === 'small'"
            (click)="setFontSize('small')">
            小
          </button>

          <button type="button" class="public-layout__font-button" [class.is-active]="fontSize === 'medium'"
            (click)="setFontSize('medium')">
            中
          </button>

          <button type="button" class="public-layout__font-button" [class.is-active]="fontSize === 'large'"
            (click)="setFontSize('large')">
            大
          </button>
        </div>

      </nav>


      <!-- 屬於後台 -->
      <!-- <li class="nav-item">
          <a class="nav-link" routerLink="/admin-review">房屋上架審核</a>
        </li> -->




      <!-- <a routerLink="/">首頁</a>
      <a routerLink="/rental-matching">租賃媒合</a>
      <a routerLink="/login">登入</a> -->

    </nav>
  </header>

  <main class="public-layout__content">
    <router-outlet></router-outlet>
  </main>

  <footer class="public-layout__footer">
    © RentHouse
  </footer>

</div>
