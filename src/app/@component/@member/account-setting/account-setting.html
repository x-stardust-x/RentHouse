<div class="modal fade" id="emailModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">更改信箱<small class="text-danger">(完成後會登出)</small></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <label>新信箱</label>
        <input class="form-control" [(ngModel)]="tempEmail" />
      </div>

      <div class="modal-footer">
        <button class="btn secondary" data-bs-dismiss="modal">取消</button>
        <button class="btn primary" (click)="saveEmail()">確認</button>
      </div>

    </div>
  </div>
</div>

<div class="modal fade" id="PwdModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">更改密碼<small class="text-danger">(完成後會登出)</small></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <label>新密碼</label>
        <input class="form-control" [(ngModel)]="newPwd" />
        <label>確定密碼</label>
        <input class="form-control" [(ngModel)]="newPwd2" />
      </div>

      <div class="modal-footer">
        <button class="btn secondary" data-bs-dismiss="modal">取消</button>
        <button class="btn primary" (click)="savePwd()">確認</button>
      </div>

    </div>
  </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content border-danger">

      <div class="modal-header">
        <h5 class="modal-title text-danger">危險操作</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        確定要註銷帳號嗎？此操作無法復原。
      </div>

      <div class="modal-footer">
        <button class="btn warn" data-bs-dismiss="modal">取消</button>
        <button class="btn danger-btn" (click)="confirmDelete()">確認刪除</button>
      </div>

    </div>
  </div>
</div>
