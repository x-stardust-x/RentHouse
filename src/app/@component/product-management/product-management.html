<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold"><span class="material-symbols-outlined align-middle">build</span> 我的技能與工具管理</h3>
    <button class="btn btn-primary" routerLink="/user-center/product">
      <span class="material-symbols-outlined align-middle">add</span> 發布新技能
    </button>
  </div>

  <div class="row">
    @for (item of products(); track item.id) {
      <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">

          <div style="height: 200px; background-color: #f8f9fa; display: flex; align-items: center; justify-content: center;">
           @if (item.coverUrl) {
  <img [src]="'https://localhost:7215/' + item.coverUrl" class="w-100 h-100" style="object-fit: cover;" alt="技能圖片">
} @else {
  <span class="material-symbols-outlined" style="font-size: 4rem; color: #dee2e6;">handyman</span>
}
          </div>

          <div class="card-body">
            <h5 class="card-title text-primary fw-bold">{{ item.name }}</h5>

            <span class="badge" [ngClass]="{'bg-success': item.status === 1, 'bg-warning text-dark': item.status === 0}">
              {{ item.status === 1 ? '已上架' : '審核中' }}
            </span>

            <ul class="list-unstyled mt-3 mb-0">
              <li><small class="text-muted">📍 服務地區：{{ item.address }}</small></li>
              <li><small class="text-muted">💰 費用：{{ item.price }} 元/次</small></li>
            </ul>
          </div>

          <div class="card-footer bg-white border-top-0 d-flex justify-content-end gap-2 pb-3">
            <button class="btn btn-outline-primary btn-sm" (click)="editProduct(item.id)">編輯</button>
            <button class="btn btn-outline-danger btn-sm" (click)="deleteProduct(item.id)">刪除</button>
          </div>

        </div>
      </div>
    }
  </div>
</div>
