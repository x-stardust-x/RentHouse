<div class="page">

  <!-- 返回 + 標題 -->
  <div class="header">
    <h1>帳號與安全設定</h1>
    <p class="sub">管理您的個人資料與帳號安全層級</p>
  </div>

  <!-- 帳號資訊 -->
  <section class="card">
    <div class="card-title">
      <mat-icon>account_circle</mat-icon>
      帳號資訊
    </div>

    <div class="row">
      <div class="col-9">
        <div class="label">登入信箱</div>
        <div class="value">{{ data().email }}</div>
      </div>
      <button class="col-2 btn">變更信箱</button>
    </div>

    <div class="row">
      <div class="col-9">
        <div class="label">綁定手機</div>
        <div class="value">{{ data().phone }}</div>
      </div>
      <button class="col-2 btn">變更號碼</button>
    </div>

    <div class="row">
      <div class="col-9">
        <div class="label">密碼</div>
        <div class="value muted">上次修改：2 個月前</div>
      </div>
      <button class="col-2 btn primary">修改密碼</button>
    </div>
  </section>
