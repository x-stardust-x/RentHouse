<div class="table-wrapper mat-elevation-z8">

  <div class="table-header">
    <h2>系統操作紀錄</h2>
  </div>

   <!-- 🔍 搜尋欄 -->
  <div class="table-filter">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>搜尋（ID / Action / IP）</mat-label>
      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="輸入關鍵字..."
      />
    </mat-form-field>
  </div>

  <div class="date-filter">

  <mat-form-field appearance="outline">
    <mat-label>開始日期</mat-label>
    <input matInput [matDatepicker]="startPicker" (dateChange)="applyDateFilter()" [(ngModel)]="startDate" [max]="today">
    <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
    <mat-datepicker #startPicker></mat-datepicker>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>結束日期</mat-label>
    <input matInput [matDatepicker]="endPicker" (dateChange)="applyDateFilter()" [(ngModel)]="endDate" [max]="today">
    <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
    <mat-datepicker #endPicker></mat-datepicker>
  </mat-form-field>

</div>


  <table mat-table [dataSource]="dataSource" class="custom-table">

    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> No. </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <!-- 管理員姓名 -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> 管理員姓名 </th>
      <td mat-cell *matCellDef="let element">
        <span class="badge user">{{element.name}}</span>
      </td>
    </ng-container>

    <!-- Action -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef> 行動 </th>
      <td mat-cell *matCellDef="let element">
        <span class="badge action">{{element.action}}</span>
      </td>
    </ng-container>

    <!-- IP -->
    <ng-container matColumnDef="ipAddress">
      <th mat-header-cell *matHeaderCellDef> IP 位置 </th>
      <td mat-cell *matCellDef="let element">
        <code class="ip">{{element.ipAddress}}</code>
      </td>
    </ng-container>

    <!-- 時間 -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef> 創建時間 </th>
      <td mat-cell *matCellDef="let element">
        {{element.createdAt | date:'yyyy-MM-dd HH:mm:ss'}}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator
    class="paginator"
    [pageSizeOptions]="[10 , 20 , 50]"
    showFirstLastButtons>
  </mat-paginator>

</div>
